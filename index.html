  <meta charset="utf-8">

  <title>ОТКРЫТЬ ПЛАТФОРМУ</title>
  <style>
    :root {
      --bg: #080909;
      --ivory: #f1eee5;
      --burgundy: #641f32;
      --burgundy-light: #85344a;
      --silver: #aeb4b0;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 22px;
      color: var(--ivory);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(65, 69, 65, .22), transparent 43%),
        linear-gradient(145deg, #111413 0%, #080909 52%, #050606 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }
    .stage {
      width: min(100%, 1040px);
      min-height: min(760px, calc(100svh - 44px));
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      border: 1px solid rgba(235, 235, 225, .10);
      background:
        linear-gradient(120deg, rgba(255,255,255,.025), transparent 42%),
        rgba(7, 9, 8, .38);
      box-shadow: 0 35px 110px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .stage::before {
      content: "";
      position: absolute;
      width: min(76vw, 650px);
      aspect-ratio: 1;
      border: 1px solid rgba(220, 225, 215, .08);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(220,225,215,.018), 0 0 0 86px rgba(220,225,215,.012);
      z-index: -1;
    }
    .composition {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(34px, 6vh, 54px);
      padding: 54px 22px;
      width: 100%;
    }
    .card-wrap {
      position: relative;
      width: clamp(190px, 28vw, 286px);
      perspective: 1200px;
      filter: drop-shadow(28px 36px 34px rgba(0,0,0,.62));
    }
    .playing-card {
      position: relative;
      width: 100%;
      aspect-ratio: 0.695;
      border-radius: 13px;
      background:
        linear-gradient(118deg, rgba(255,255,255,.9), transparent 18%, transparent 82%, rgba(0,0,0,.08)),
        linear-gradient(145deg, #f7f3e9 0%, #e9e3d5 100%);
      color: #101111;
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,.30), inset 0 0 35px rgba(75,65,48,.08);
      transform: rotate(-5deg) rotateY(-7deg);
      overflow: hidden;
    }
    .playing-card::before {
      content: "";
      position: absolute;
      inset: 13px;
      border: 1px solid rgba(20,22,20,.13);
      border-radius: 5px;
      pointer-events: none;
    }
    .corner {
      position: absolute;
      top: 24px;
      left: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Georgia, "Times New Roman", serif;
      line-height: .85;
    }
    .corner strong { font-size: 39px; font-weight: 600; }
    .corner span { font-size: 31px; margin-top: 4px; }
    .ace {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(112px, 19vw, 190px);
      line-height: 1;
      transform: translateY(8px);
      text-shadow: 0 2px 0 rgba(255,255,255,.12);
    }
    .corner.bottom {
      top: auto;
      left: auto;
      right: 26px;
      bottom: 24px;
      transform: rotate(180deg);
    }
    .card-edge {
      position: absolute;
      inset: auto 9% -9px 9%;
      height: 18px;
      background: linear-gradient(#c9c3b6, #77766f);
      border-radius: 0 0 8px 8px;
      z-index: -1;
      transform: rotate(-5deg);
      filter: blur(.2px);
    }
    .cta {
      min-height: 60px;
      width: min(100%, 330px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 26px;
      border: 1px solid rgba(239, 220, 218, .32);
      border-radius: 3px;
      color: #fff;
      background: linear-gradient(135deg, var(--burgundy-light), var(--burgundy) 68%, #4b1727);
      text-decoration: none;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .075em;
      text-align: center;
      box-shadow: 0 13px 35px rgba(74, 16, 34, .34), inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .2s ease, filter .2s ease;
    }
    .cta:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .cta:focus-visible { outline: 2px solid var(--ivory); outline-offset: 5px; }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .stage { min-height: calc(100svh - 20px); }
      .composition { gap: 42px; padding: 34px 20px; }
      .card-wrap { width: clamp(185px, 58vw, 250px); }
      .ace { font-size: clamp(118px, 34vw, 160px); }
      .corner strong { font-size: 34px; }
      .corner span { font-size: 27px; }
      .cta { width: min(100%, 320px); min-height: 58px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
